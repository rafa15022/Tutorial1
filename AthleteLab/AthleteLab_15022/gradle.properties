# Mais memória para o Gradle, Kotlin e D8/R8.
# Corrige erros do tipo: java.lang.OutOfMemoryError: Java heap space
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Reduz consumo de memória em máquinas com menos RAM
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

# Memória do compilador Kotlin
kotlin.daemon.jvmargs=-Xmx2048m

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
